# Publish to PyPI when a release tag is pushed -- if the tagged commit passes
# this repository's CI.
#
# No secret appears in this file and none is configured for it. Authentication
# is PyPI's trusted publishing: `id-token: write` lets the runner mint a
# short-lived OIDC token that PyPI exchanges for upload rights, scoped to this
# repository, this workflow and this environment. A leaked token is not a
# category of accident that can happen here, because there is no token.
#
# The same mechanism creates a project that does not exist yet, through a
# *pending* publisher registered on PyPI beforehand -- which is why none of
# these packages ever needs an account-scoped token.
#
# The release tool cuts a release -- bump, commit, tag `r<version>`, push --
# and the pushed tag is all this file is told (the tool's ADR-0022). From there
# it runs ci.yml on the tagged commit and publishes only if that passes, so a
# release must pass exactly what CI checks, by construction. Until 2026-11-19
# this file ran pytest alone, and podpack r0.10.1 reached PyPI from a commit
# whose CI had failed, on a check that only CI made.

name: publish

on:
  push:
    tags: ["r*"]
  # Run by hand, it publishes only from a release tag: dispatched on a
  # branch, the tag check below refuses the branch's name.
  workflow_dispatch:

jobs:
  ci:
    # This repository's own checks, on the tagged commit. A failure here skips
    # the publish job, and PyPI never hears of the tag.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # The whole of what trusted publishing needs.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: The tag names exactly what this commit declares
        # The release tool's own check, fetched at a pinned commit so it cannot
        # change underneath a release: the tag must name pyproject.toml's
        # version as a string, and a .dev or +local version -- one that marks
        # its commit as unreleased -- is refused outright. The shell comparison
        # this replaced caught the first and not the second.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/verify_tag.py" \
            https://raw.githubusercontent.com/holdenweb/release/d82a039efa3885d701ff9fda8201eeb92ec9e61e/.github/scripts/verify_tag.py
          uv run --no-project --with packaging python "$RUNNER_TEMP/verify_tag.py"

      - name: Build
        # Into a clean checkout, so no artefact from an earlier build can ship
        # beside this one.
        run: uv build

      - name: Publish
        # No `with:` block: uv finds the OIDC token through the environment
        # GitHub provides, and PyPI matches it against the trusted publisher.
        run: uv publish --trusted-publishing always
