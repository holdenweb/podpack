# Run the checks on every push to a branch and every pull request -- and on
# every release tag, when publish.yml calls this workflow and publishes only if
# it passes.
#
# So a release gets everything below, which it never did while publish.yml ran
# pytest alone: mypy, whether the substrate record is current -- the check
# podpack r0.10.1 reached PyPI past -- and test_migrate_persists, which needs a
# real PostgreSQL. The service below is the only place the suite ever gets one.
# Without it that test skips, and the silent migration-rollback it guards goes
# unseen exactly as it did the night it shipped.

name: ci

on:
  push:
    # Branches only. A release tag reaches this workflow through publish.yml,
    # so a tag push no longer runs it twice.
    branches: ["**"]
  pull_request:
  workflow_call:

# A newer push to the same branch makes an in-flight run pointless; drop it.
# github.workflow names the caller when publish.yml runs this, so a release's
# run has a group of its own: no other run on the tag can cancel it, which
# would skip the publish without a word.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # A throwaway PostgreSQL, created and destroyed with the job and reachable
    # only from inside it. The password is a test value in a public file on
    # purpose -- it protects nothing, and prefixing it `test-` says so (CLAUDE.md
    # §8). pg_isready carries -U/-d because the bare probe reports ready while
    # the bootstrap is still creating the database (gotcha 6), and a step that
    # then connects too early fails as if the test were wrong.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test-user
          POSTGRES_PASSWORD: test-pw
          POSTGRES_DB: test-db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test-user -d test-db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # An exact release where checkout takes a major: setup-uv stopped
      # publishing floating tags at v8, so `@v10` would not resolve. Its
      # releases are immutable, so this tag cannot be moved under us either.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Types
        # Configured (files = src, tests) and, until now, run only by hand.
        run: uv run mypy

      - name: Tests
        # The URI turns on test_migrate_persists against the service above; the
        # rest of the suite is engine-neutral and does not read it. `uv run`
        # syncs the dev group first.
        env:
          PODPACK_TEST_DATABASE_URI: postgresql+psycopg2://test-user:test-pw@localhost:5432/test-db
        run: uv run pytest -q

      - name: The substrate record is current
        # substrate.json must name the version whose files it holds, or a
        # rebuild ships stale substrate silently -- the recurring footgun this
        # is meant to end. This step carried `continue-on-error: true` from the
        # day it was added until the record caught up with 0.9.1, so it was
        # advisory for its whole life and never once failed a build. It fails
        # them now. Red here means a substrate file moved without
        # `substrate upgrade` recording it (README: "A release that changes the
        # substrate needs one more step first"); run that, rather than excusing
        # the step a second time.
        run: uv run podpack substrate status --check
