# Host-based authentication, bind-mounted read-only at
# /etc/postgresql/pg_hba.conf. Because postgresql.conf points `hba_file` here,
# this file replaces the one initdb writes into the data directory -- so it is
# the single place client authentication is decided.
#
# Reload without a restart:  podman compose exec postgres pg_ctl reload
#
# TYPE  DATABASE  USER  ADDRESS       METHOD

# Unix socket. `trust` here is what lets the image's first-run bootstrap and
# the healthcheck's pg_isready work without juggling passwords; reaching this
# socket at all already requires being inside the container.
local   all       all                 trust

# TCP. Everything else -- the Flask container over the compose network, and
# psql on your host through the published port -- must authenticate.
# scram-sha-256 is the modern default; md5 is obsolete.
host    all       all   127.0.0.1/32  scram-sha-256
host    all       all   ::1/128       scram-sha-256
host    all       all   all           scram-sha-256
