# Operating-system to database username mappings, bind-mounted read-only at
# /etc/postgresql/pg_ident.conf.
#
# Nothing to map: pg_hba.conf uses `trust` on the local socket and
# scram-sha-256 over TCP, neither of which consults this file. It exists
# because postgresql.conf names it as `ident_file`, and PostgreSQL wants the
# file it was pointed at to be present.
#
# MAPNAME  SYSTEM-USERNAME  PG-USERNAME
