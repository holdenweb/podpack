# Host-specific site configuration, bind-mounted read-only at
# /etc/holdenweb/app.toml. Anything that varies between laptop, staging and
# production but is *not* a secret belongs here; secrets stay in the
# environment, via secrets.env. Edit and `podman compose restart web` to
# apply -- but note that changes under src/ need a rebuild, not a restart.

[site]
name = "holdenweb.com (podman PostgreSQL lab)"
environment = "local"
# The address the *world* uses, for links that have to be absolute and are
# built with no request to take a Host header from -- mail sent from a job, a
# feed, a CLI command. Read with `podpack.absolute_url()`.
#
# On a proxied host this is nothing like where the container listens: Opalstack
# serves https://example.com/ and forwards to some allocated high port. The two
# are the same number only in a lab, as here. A value with no scheme and host
# is a boot failure, because `urljoin` turns one into a link nothing can follow.
base_url = "http://localhost:8458"

# The site's installed apps, in the order they are installed. This list is what
# a site mostly *is*: adding a feature is a line here and a restart, with no
# code change, no rebuild and no change to compose.yaml. Order matters -- nav
# entries appear in it, and an app's init may rely on an earlier app's service.
# Empty until podpack-notes is pushed. It now lives in its own repository, and
# a container build cannot install it from a sibling path -- that fails with
# "Distribution not found at: file:///...". Once the repo has a remote, this
# becomes a two-line change and the lab installs an app from outside itself,
# which is the whole point of moving it out:
#
#   pyproject.toml   podpack-notes = { git = "https://github.com/holdenweb/podpack-notes.git" }
#                    and move it from [dependency-groups] dev into [project] dependencies
#   here             apps = ["podpack_notes"]
apps = []

# Where the site chooses to mount an app, overruling the `url_prefix` the app
# asks for. Only apps being moved need an entry. Site policy rather than app
# configuration, which is why it lives here and not in `[apps.<name>]` -- an app
# has no part in the decision and never sees it.
#
# The key is the app's *name*, which is its blueprint's name, and that is not
# always the import name above: `podpack_notes` is imported, and answers to
# `notes`. Naming an app that is not installed is a boot failure rather than a
# line that quietly does nothing.
#
# [site.mounts]
# notes = "/writing/notes"

[database]
# Passed straight to SQLAlchemy's engine. The URI itself is a secret (it
# carries the password) and so lives in the environment, not here. Only the
# keys actually named here are passed on, so a site on a dialect that does not
# pool this way simply leaves them out.
pool_size = 5
max_overflow = 5
pool_pre_ping = true
echo = false

[limits]
max_upload_bytes = 1048576

# Each installed app gets its own namespace, so a site can tune one without
# touching another, and podpack never has to know what any of it means.
[apps.notes]
page_size = 20
