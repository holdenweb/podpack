# Host-specific PostgreSQL configuration, bind-mounted read-only at
# /etc/postgresql/postgresql.conf and selected with
# `postgres -c config_file=...` in compose.yaml. Edit here and
# `podman compose restart postgres`; the image itself never changes.
#
# Because this file lives outside the data directory, initdb's own generated
# postgresql.conf is ignored entirely -- so anything you need must be set here
# or left at PostgreSQL's built-in default. `ALTER SYSTEM` will fail, by
# design: configuration belongs to the host, not to the database.
#
# Reference: https://www.postgresql.org/docs/17/runtime-config.html

# ---------------------------------------------------------------------------
# File locations. hba_file and ident_file must be given explicitly: they
# default to sitting beside this file, and both are mounted there.
# ---------------------------------------------------------------------------
data_directory = '/var/lib/postgresql/data/pgdata'
hba_file = '/etc/postgresql/pg_hba.conf'
ident_file = '/etc/postgresql/pg_ident.conf'

# ---------------------------------------------------------------------------
# Connections
# ---------------------------------------------------------------------------
# '*' means all interfaces of the container's own network namespace. Exposure
# to the outside world is decided by the port mapping in compose.yaml, which
# binds to 127.0.0.1 only.
listen_addresses = '*'
port = 5432
max_connections = 50
password_encryption = scram-sha-256

# ---------------------------------------------------------------------------
# Memory. A laptop should not hand half its RAM to the database; raise these
# to something realistic when the same file is deployed to a real host.
# ---------------------------------------------------------------------------
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 512MB

# ---------------------------------------------------------------------------
# Logging. Host-mounted, so logs survive the container and are readable with
# the host's own tooling.
# ---------------------------------------------------------------------------
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql.log'
log_truncate_on_rotation = off
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 200
log_checkpoints = on
log_connections = on
log_disconnections = on

# ---------------------------------------------------------------------------
# Write-ahead log
# ---------------------------------------------------------------------------
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB

# ---------------------------------------------------------------------------
# Locale and timezone. UTC everywhere; render local time in the application.
# ---------------------------------------------------------------------------
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'
