# Host-specific MongoDB configuration, bind-mounted read-only at
# /etc/mongo/mongod.conf. Edit here and `podman compose restart mongodb`; the
# image itself never changes -- the same arrangement postgresql.conf has, and
# for the same reason: configuration belongs to the host and to version
# control, not to whoever last had an admin session (ADR-0018).
#
# Reference: https://www.mongodb.com/docs/manual/reference/configuration-options/

storage:
  # Must match the container-side path of the host data bind mount.
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      # A laptop should not hand half its RAM to WiredTiger. Raise this to
      # something realistic (or drop the key to accept the default of
      # 50% of RAM - 1GB) when the same file is deployed to a real host.
      cacheSizeGB: 0.5

systemLog:
  destination: file
  # Host-mounted, so logs survive the container and are readable with the
  # host's own tooling.
  path: /var/log/mongodb/mongod.log
  logAppend: true

net:
  port: 27017
  # 0.0.0.0 inside the container's own network namespace, which reaches no
  # further than the compose network: this service publishes no host port at
  # all. `podman compose --profile mongodb-port up -d mongodb-port` forwards
  # one when a host-side mongosh wants it (ADR-0027).
  bindIp: 0.0.0.0

security:
  authorization: enabled

operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 200
