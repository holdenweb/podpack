name: ${SITE_NAME:-podpack}

# The base of a podpack stack: the site itself, its storage, and the gate that
# brings the schema up before it serves. **No backing service is here.** Which
# ones a site runs is COMPOSE_FILE's business, one overlay per service, so that
# a site needing MongoDB and no SQL is expressed by its configuration rather
# than by editing this file.
#
# Compose profiles cannot do this job, and it is worth recording why rather
# than rediscovering it: a service outside an enabled profile is not merely
# absent, it is *undefined*, so `web.depends_on: {postgres: ...}` makes the
# whole project invalid the moment the profile is off -- "service web depends
# on undefined service postgres". Overlays merge `depends_on` additively
# instead, which is how the ordering guarantees survive being optional.
# Measured; see ADR-0028.
#
#   * persistent state  -> bind-mounted from ${HOST_DATA_DIR} on the host
#   * host-specific cfg -> bind-mounted read-only from ./config
#   * per-host wiring   -> .env, the file you edit when the site moves
#   * credentials       -> secrets.env, restored verbatim and never edited
#
# Only .env is read for substitution, so nothing below refers to a credential
# and this file stays safe to commit and to read. `podman compose config` is a
# different matter -- it expands env_file contents into what it prints, so
# treat its output as being as sensitive as secrets.env itself.

# compose.yaml alone is not a complete stack, and this is where saying so is
# cheapest: compose interpolates a top-level extension field before it builds
# the project, so a missing COMPOSE_FILE stops here with a sentence rather than
# several seconds later with `web` unable to resolve a hostname. Quoted because
# a plain YAML scalar may not contain ": ".
x-podpack-services: '${COMPOSE_FILE:?compose.yaml alone is not a complete podpack stack. Every backing service is an overlay named in COMPOSE_FILE -- set it in .env, e.g. COMPOSE_FILE=compose.yaml:compose.postgres.yaml}'

services:
  # Bind-mounted host directories arrive owned by whoever owns them on the
  # host, which is never the unprivileged uid a server drops to. This
  # short-lived root container fixes that once, before anything else starts,
  # so the suite comes up on a bare machine with no manual chown step.
  #
  # It handles the *app* roots only. Every service brings its own `init-<name>`
  # rather than adding mounts here, and that is not tidiness: compose REPLACES
  # `command:` when merging files while concatenating `volumes:`, so an overlay
  # that added a mount here would silently drop this chown and leave the app
  # unable to write its own data. Measured, and the reason the split exists.
  #
  # It is not a privilege escalation: under rootless podman "root" here is your
  # own user in a namespace, and the uids map to your subuids. On macOS the
  # change is namespace-local -- the host keeps its own ownership.
  init-storage:
    image: docker.io/library/busybox:1.37
    user: "0:0"
    command:
      - sh
      - -c
      - |
        set -e
        chown -R 10001:10001 /mnt/app-data /mnt/app-logs
        echo "app storage ownership prepared"
    volumes:
      - ${HOST_DATA_DIR}/apps:/mnt/app-data
      - ${HOST_LOG_DIR}/apps:/mnt/app-logs

  # Schema changes run once, here, rather than from inside the application.
  # gunicorn starts several workers at once, so anything that creates tables at
  # boot is a race the losers crash on -- which is why the old demo's
  # `create_all` had to be wrapped in a try/except. A one-shot service gated by
  # `service_completed_successfully`, the same pattern init-storage uses, means
  # `web` cannot start against a schema that has not been brought up to date.
  #
  # It needs no data or log mounts: building the target metadata imports the
  # installed apps' models and nothing else, with no Flask app in sight.
  migrate:
    build:
      context: .
      dockerfile: Containerfile
      args:
        # Stamped into the image and reported by /_status, so "is this running
        # my code?" has an exact answer. scripts/up.sh supplies it.
        GIT_SHA: ${GIT_SHA:-unknown}
    image: localhost/${SITE_NAME:-podpack}-web:latest
    restart: "no"
    env_file:
      - .env
      - secrets.env
    environment:
      # SQLALCHEMY_DATABASE_URI comes from secrets.env.
      PODPACK_CONFIG: /etc/holdenweb/app.toml
      # Each enabled overlay stamps its own PODPACK_SERVICE_<NAME> in here, so
      # podpack can check what compose actually merged against what the site
      # said it wanted -- a marker a file cannot fake.
      PODPACK_SERVICE_MARKERS: "1"
    volumes:
      - ./config/app.toml:/etc/holdenweb/app.toml:ro
    command: ["alembic", "upgrade", "head"]
    # No depends_on here: a service's overlay adds its own edge, which is what
    # lets a site run without that service at all.

  web:
    build:
      context: .
      dockerfile: Containerfile
      args:
        # Stamped into the image and reported by /_status, so "is this running
        # my code?" has an exact answer. scripts/up.sh supplies it.
        GIT_SHA: ${GIT_SHA:-unknown}
    image: localhost/${SITE_NAME:-podpack}-web:latest
    restart: unless-stopped
    env_file:
      - .env
      - secrets.env
    environment:
      # SQLALCHEMY_DATABASE_URI comes from secrets.env -- the same variable
      # name the real application uses, so the app code never has to know it is
      # in a lab.
      PODPACK_CONFIG: /etc/holdenweb/app.toml
      # Roots, not per-app directories. podpack creates a subdirectory of each
      # for every installed app, so nothing here changes when the app list
      # does -- installing a feature stays an edit to app.toml and a restart.
      PODPACK_DATA_ROOT: /var/lib/holdenweb/apps
      PODPACK_LOG_ROOT: /var/log/holdenweb/apps
      PODPACK_SERVICE_MARKERS: "1"
    volumes:
      # As above: add `,Z` to the writable mounts and `,z` to the read-only
      # one on SELinux hosts. See README, "Running on Linux".
      - ${HOST_DATA_DIR}/apps:/var/lib/holdenweb/apps
      - ${HOST_LOG_DIR}/apps:/var/log/holdenweb/apps
      - ./config/app.toml:/etc/holdenweb/app.toml:ro
    ports:
      # The external port is the one thing a host gets to dictate: Opalstack
      # allocates it to an "Nginx Proxy Port" application and proxies the site
      # to it, so deploying there is an edit of WEB_HOST_PORT in .env and
      # nothing else. The address is settable too, because their own example
      # publishes on all interfaces while a lab is better off on loopback --
      # so which one is right belongs to the host, not to this file.
      - "${WEB_BIND_ADDR:-127.0.0.1}:${WEB_HOST_PORT}:8000"
    depends_on:
      # Long form throughout: compose merges a mapping additively and would
      # *replace* a list, so an overlay could not add its own edge.
      init-storage:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # A script, not a `python -c` one-liner: podman splits ["CMD", ...]
      # arguments on whitespace, so any argument containing spaces arrives
      # mangled. See container/healthcheck.py.
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
