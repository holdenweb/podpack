[project]
name = "podpack"
version = "0.2.0"
description = "A framework for building and running web sites out of pluggable apps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Deliberately the same stack the real holdenweb package uses, so that what
    # works here has a fair chance of working there.
    "flask>=3.0",
    "flask-sqlalchemy>=3.1.1",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.13",
    "gunicorn>=22.0",
]

[[project.authors]]
name = "Steve Holden"
email = "steve@holdenweb.com"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "podpack"

# The lab site's app, and an *extra* rather than a dependency: podpack is a
# framework, so installing it must not force an app on anyone. Only the image
# built from this repository asks for it, which is what makes this repository a
# working demonstration of installing an app from outside itself.
#
# The test suite deliberately does not use it -- tests/fixture_app exists so
# podpack can be tested with nothing else checked out.
[project.optional-dependencies]
lab = ["podpack-notes"]

[dependency-groups]
dev = ["pytest>=8.0", "mypy>=1.11"]

[tool.uv.sources]
# git, not a path: a path source cannot be resolved inside a container build,
# which fails with "Distribution not found at: file:///...".
podpack-notes = { git = "https://github.com/holdenweb/podpack-notes.git" }

[tool.mypy]
# Annotations nobody checks are comments that look authoritative, so the
# checker is a dependency rather than something to remember to install.
files = ["src", "tests"]
# Flask-SQLAlchemy and flask-paranoid ship no stubs; missing imports would
# otherwise drown the errors worth reading.
ignore_missing_imports = true
