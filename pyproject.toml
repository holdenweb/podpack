[project]
name = "podpack"
version = "0.2.0"
description = "A framework for building and running web sites out of pluggable apps"
readme = "README.md"
license = "MIT"
license-files = ["LICENCE"]
requires-python = ">=3.12"
dependencies = [
    # Deliberately the same stack the real holdenweb package uses, so that what
    # works here has a fair chance of working there.
    "flask>=3.0",
    "flask-sqlalchemy>=3.1.1",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.13",
    "gunicorn>=22.0",
]

[[project.authors]]
name = "Steve Holden"
email = "steve@holdenweb.com"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "podpack"

# podpack depends on no app, and this is the file that has to keep saying so:
# a framework that installs one is a site. The demonstration of installing an
# app lives in ~/sites/podpack-demo, which is a site and installs two packages
# from git the way any site does.
[dependency-groups]
dev = ["pytest>=8.0", "mypy>=1.11"]

[tool.mypy]
# Annotations nobody checks are comments that look authoritative, so the
# checker is a dependency rather than something to remember to install.
files = ["src", "tests"]
# Flask-SQLAlchemy and flask-paranoid ship no stubs; missing imports would
# otherwise drown the errors worth reading.
ignore_missing_imports = true
