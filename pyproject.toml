[project]
name = "podpack"
version = "0.5.1"
description = "A framework for building and running web sites out of pluggable apps"
readme = "README.md"
license = "MIT"
license-files = ["LICENCE"]
requires-python = ">=3.12"
keywords = ["flask", "plugins", "web", "containers", "podman"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    # Deliberately the same stack the real holdenweb package uses, so that what
    # works here has a fair chance of working there.
    "flask>=3.0",
    "flask-sqlalchemy>=3.1.1",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.13",
    "gunicorn>=22.0",
    # Login is core rather than each site's to wire (ADR-0033). It brings
    # flask-wtf and passlib with it, and the `users`/`roles` commands a site
    # needs before anybody can read /_status.
    "flask-security-too>=5.6.2",
    "argon2-cffi>=25.1.0",
]

# The driver for an optional core service, installed only by a site that runs
# one: `podpack[mongodb]`. The catalogue names this extra, so it has to exist.
[project.optional-dependencies]
mongodb = ["pymongo>=4.8"]

# PyPI's sidebar is a project's only signposting for anyone who arrives
# there rather than at the repository.
[project.urls]
Homepage = "https://github.com/holdenweb/podpack"
Repository = "https://github.com/holdenweb/podpack"
Issues = "https://github.com/holdenweb/podpack/issues"

[[project.authors]]
name = "Steve Holden"
email = "steve@holdenweb.com"

[project.scripts]
podpack = "podpack.cli:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "podpack"

# podpack depends on no app, and this is the file that has to keep saying so:
# a framework that installs one is a site. The demonstration of installing an
# app lives in ~/sites/podpack-demo, which is a site and installs two packages
# from git the way any site does.
[dependency-groups]
dev = ["pytest>=8.0", "mypy>=1.11"]

[tool.mypy]
# Annotations nobody checks are comments that look authoritative, so the
# checker is a dependency rather than something to remember to install.
files = ["src", "tests"]
# Flask-SQLAlchemy and flask-paranoid ship no stubs; missing imports would
# otherwise drown the errors worth reading.
ignore_missing_imports = true
# The canonical substrate is shipped data, not importable code -- its env.py
# and healthcheck.py are copied into sites, never imported from here.
exclude = 'src/podpack/substrate/data/'
