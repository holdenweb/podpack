[project]
name = "podpack"
version = "0.1.1"
description = "A framework for building and running web sites out of pluggable apps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Deliberately the same stack the real holdenweb package uses, so that what
    # works here has a fair chance of working there.
    "flask>=3.0",
    "flask-sqlalchemy>=3.1.1",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.13",
    "gunicorn>=22.0",
]

[[project.authors]]
name = "Steve Holden"
email = "steve@holdenweb.com"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Two top-level packages in one distribution: the framework, and the first
# plugin. `podpack_notes` is deliberately not a submodule of `podpack` -- when
# a plugin graduates to a project of its own, as `pdf` will, that should be a
# directory move plus a pyproject.toml rather than a refactor.
module-name = ["podpack", "podpack_notes"]

[dependency-groups]
dev = ["pytest>=8.0"]
